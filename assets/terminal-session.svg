<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" role="img" aria-label="Animated simulated security terminal with harmless example commands">
<style>
.bg{fill:#071218;stroke:#00d9ae;stroke-width:1.5}.bar{fill:#0b242a}.txt{fill:#d6f6ef;font:16px monospace}.prompt{fill:#00ffab;font:16px monospace}.muted{fill:#789b9b;font:13px monospace}.cursor{fill:#00ffab;animation:blink 1s steps(1) infinite}.cmd{opacity:0;animation:appear 12s infinite}.c1{animation-delay:0s}.c2{animation-delay:2.6s}.c3{animation-delay:5.2s}.c4{animation-delay:8s}@keyframes appear{0%,4%{opacity:0}8%,95%{opacity:1}100%{opacity:0}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){.cmd{animation:none;opacity:1}.cursor{animation:none}}</style>
<rect x="2" y="2" width="996" height="256" rx="12" class="bg"/><path d="M14 2 H986 Q998 2 998 14 V44 H2 V14 Q2 2 14 2" class="bar"/>
<circle cx="25" cy="23" r="5" fill="#ff6574"/><circle cx="43" cy="23" r="5" fill="#f0bd54"/><circle cx="61" cy="23" r="5" fill="#00df9a"/><text x="335" y="28" class="muted">kernelkill@offsec: ~/authorized-lab</text>
<g class="cmd c1"><text x="30" y="76" class="prompt">root@kernelkill:~# whoami</text><text x="30" y="98" class="txt">security-researcher</text></g>
<g class="cmd c2"><text x="30" y="125" class="prompt">root@kernelkill:~# cat mission.txt</text><text x="30" y="147" class="txt">research responsibly | automate security | share knowledge</text></g>
<g class="cmd c3"><text x="30" y="175" class="prompt">root@kernelkill:~# ./check_scope.sh</text><text x="30" y="197" class="txt">[ OK ] authorized lab only | responsible disclosure enabled</text></g>
<g class="cmd c4"><text x="30" y="226" class="prompt">root@kernelkill:~# echo "Stay curious. Stay ethical."</text><rect class="cursor" x="728" y="212" width="9" height="17"/></g>
</svg>
